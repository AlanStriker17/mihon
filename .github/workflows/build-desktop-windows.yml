name: Build Mihon Desktop for Windows

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install WiX Toolset
        shell: pwsh
        run: choco install wixtoolset --no-progress --yes

      - name: Build Windows installer
        shell: pwsh
        run: .\gradlew.bat :desktop:client:packageWindowsExe --no-daemon --max-workers=2

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: mihon-desktop-windows
          path: desktop/client/build/windows-package/*.exe
          if-no-files-found: error
          retention-days: 14
